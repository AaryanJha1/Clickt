<!-- Shared global header. Rendered by build-shell.js. -->
<header class="page-header shared-site-header" data-site-shell-header>
    <a href="index.html" class="brand">
        <img src="IOS Promotion/click_logo.webp" alt="Clickt Logo" decoding="async" data-i18n-attr="alt:siteShell.brand.logoAlt">
        Clickt
    </a>
    <nav class="page-header-nav shared-site-header-nav" aria-label="Site navigation" data-i18n-attr="aria-label:siteShell.header.navigation">
        <div class="nav-dropdown shared-product-dropdown" data-site-shell-dropdown>
            <a href="index.html" class="nav-dropdown-trigger">
                <span data-i18n="siteShell.header.product">Product</span>
                <span class="nav-dropdown-caret" aria-hidden="true">&#9662;</span>
            </a>
            <div class="nav-dropdown-menu" id="site-shell-product-menu" role="menu">
                <div class="nav-dropdown-panel site-nav-dropdown-panel">
{{PRODUCT_LINKS}}
                </div>
            </div>
        </div>
{{DIRECT_LINKS}}
    </nav>
    <details class="header-dropdown shared-site-mobile-nav" data-site-shell-mobile-nav>
        <summary aria-label="Open site navigation menu" data-i18n-attr="aria-label:siteShell.header.openMenu"><span class="header-dropdown-icon" aria-hidden="true"><span></span></span></summary>
        <nav class="header-dropdown-menu" aria-label="Site navigation" data-i18n-attr="aria-label:siteShell.header.navigation">
            <a class="header-dropdown-group-label header-dropdown-group-link" href="index.html" data-i18n="siteShell.header.product">Product</a>
{{MOBILE_PRODUCT_LINKS}}
            <div class="header-dropdown-divider" role="separator"></div>
{{MOBILE_DIRECT_LINKS}}
        </nav>
    </details>
</header>
