<!-- Shared platform and language utility strip. Rendered by build-shell.js. -->
<div class="platform-strip shared-platform-strip" data-site-shell-utility aria-label="Clickt platform and language options" data-i18n-attr="aria-label:siteShell.utility.ariaLabel">
    <span class="shared-platform-copy" data-i18n="siteShell.utility.platform">Apple · Android</span>
    <div class="lang-toggle shared-platform-language" role="group" aria-label="Choose language" data-i18n-attr="aria-label:siteShell.utility.languageLabel">
        <button type="button" class="lang-btn is-active" data-lang="en" aria-pressed="true" data-i18n="siteShell.utility.english">EN</button>
        <button type="button" class="lang-btn" data-lang="ne" aria-pressed="false" data-i18n="siteShell.utility.nepali">ने</button>
    </div>
</div>
